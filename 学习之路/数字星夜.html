<head>

<title>数字星夜 · 一年级数学 20 以内加减法 · Three.js 2D 几何游戏</title>
<style>

  #hud{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;padding:10px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  #hudTopL{display:flex;gap:10px;align-items:center}
  .pill{background:rgba(10,14,31,.72);border:1px solid rgba(255,255,255,.22);color:#ffe9b8;border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700;backdrop-filter:blur(4px)}

  #backBtn{pointer-events:auto;background:#2f3b68;color:#fff;border:1px solid #5b6fc0;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer}
  #backBtn:hover{background:#3d4e9e}
  #statusLine{position:fixed;top:64px;left:0;right:0;z-index:20;text-align:center;pointer-events:none;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #formula{position:fixed;bottom:150px;left:0;right:0;z-index:20;text-align:center;pointer-events:none;font-size:26px;font-weight:800;color:#9ee6ff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  #toast{position:fixed;top:38%;left:0;right:0;z-index:30;text-align:center;pointer-events:none;font-size:34px;font-weight:900;color:#ffd75e;text-shadow:0 3px 12px rgba(0,0,0,.8);opacity:0;transition:opacity .35s}
  #toast.show{opacity:1}
  #gameUI{position:fixed;bottom:14px;left:0;right:0;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:8px 12px;pointer-events:none}
  #gameUI>*{pointer-events:auto}
  .gbtn{background:linear-gradient(#5b6fc0,#3d4e9e);color:#fff;border:2px solid #8fa2e8;border-radius:14px;padding:14px 20px;font-size:20px;font-weight:800;cursor:pointer;min-width:70px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .gbtn:hover{filter:brightness(1.15)}
  .gbtn:active{transform:translateY(2px)}
  .gbtn.gold{background:linear-gradient(#e8a33d,#c47e14);border-color:#ffd98a;color:#3a2500}
  .gbtn.red{background:linear-gradient(#d96a5a,#b3452f);border-color:#f0a08f}
  .gbtn.green{background:linear-gradient(#4fae6d,#2f8a4c);border-color:#8fd8a8}
  .gbtn.small{font-size:16px;padding:10px 14px;min-width:54px}

  .gmsg{background:rgba(10,14,31,.78);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:10px 18px;font-size:18px;font-weight:700;backdrop-filter:blur(4px)}
  .gmsg b{color:#ffd75e}
  .grow{flex-basis:100%;height:0}
  #fade{position:fixed;inset:0;background:#0a0e1f;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
  #fade.on{opacity:1;pointer-events:auto}
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.78);backdrop-filter:blur(6px)}
  .overlay.hidden{display:none}
  .card{background:linear-gradient(#232c55,#151d3d);border:2px solid #5b6fc0;border-radius:24px;padding:34px 44px;max-width:680px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .card h1{color:#ffd75e;font-size:40px;margin:0 0 6px;letter-spacing:2px}
  .card h2{color:#fff;font-size:22px;margin:0 0 16px;font-weight:600}
  .card p{color:#c7d2f5;font-size:16px;line-height:1.8;margin:4px 0}
  .card .sub{color:#8fa2e8;font-size:14px;line-height:1.7;margin:8px 0}
  .row{display:flex;justify-content:center;gap:12px;margin:18px 0 8px;flex-wrap:wrap}
  .lvlBtn{background:#2f3b68;color:#fff;border:2px solid #5b6fc0;border-radius:14px;padding:12px 22px;font-size:20px;font-weight:800;cursor:pointer}
  .lvlBtn.on{background:#e8a33d;border-color:#ffd98a;color:#3a2500}
  .bigBtn{background:linear-gradient(#e8a33d,#c47e14);color:#3a2500;border:none;border-radius:16px;padding:16px 40px;font-size:24px;font-weight:900;cursor:pointer;margin-top:8px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .bigBtn:hover{filter:brightness(1.1)}
  .stars{font-size:44px;letter-spacing:8px;margin:6px 0}
  .stars .off{color:#3a4468}
  #ratingCard .got{color:#9ee6ff;font-size:20px;font-weight:700}
  #hintLine{font-size:14px;color:#8fa2e8;margin-top:10px}
</style>
</head>
<body>
<div id="sceneWrap"></div>

<div id="hud">
  <div id="hudTopL">
    <div class="pill">金币 <b id="coinVal">0</b></div>
    <div class="pill">星星 <b id="starVal">0</b></div>
  </div>
  <button id="backBtn" style="display:none">返回夜空</button>
</div>
<div id="statusLine"></div>
<div id="formula"></div>
<div id="gameUI"></div>
<div id="toast"></div>
<div id="fade"></div>

<div id="startScreen" class="overlay">
  <div class="card">
    <h1>数字星夜</h1>
    <h2>卖火柴的小女孩 · 数学大冒险（2D 几何版）</h2>
    <p>夜空里有六个发光的几何入口，每一个通向一个 2D 游戏：摘苹果、扶老奶奶过马路、爬楼梯、打靶、时钟救援、方阵寻宝。所有场景和实物都用圆形、三角形、矩形和线条拼成。</p>
    <p class="sub">数字是用来记录实物多少的：苹果个数、走过的步数、楼层高度、靶环数、时钟刻度、矩阵坐标。<br>每局按成绩获得 1–3 星和金币，全部计算过程都会当场显示。</p>
    <button id="startBtn" class="bigBtn">开始冒险</button>
    <div id="hintLine">建议使用 Chrome / Edge 打开 · 首次点击画面后音效开启 · 需要联网加载 three.js</div>
  </div>
</div>

<div id="introScreen" class="overlay hidden">
  <div class="card">
    <h2 id="introTitle">游戏</h2>
    <p id="introDesc"></p>
    <div class="row" id="lvlRow"></div>
    <button id="introGo" class="bigBtn">开始游戏</button>
  </div>
</div>

<div id="ratingScreen" class="overlay hidden">
  <div class="card" id="ratingCard">
    <h2 id="ratingTitle">完成！</h2>
    <div class="stars" id="ratingStars"></div>
    <div class="got" id="ratingGot"></div>
    <div class="row">
      <button id="againBtn" class="bigBtn">再玩一次</button>
      <button id="backWorldBtn" class="bigBtn" style="background:linear-gradient(#5b6fc0,#3d4e9e);color:#fff">返回夜空</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/DragControls.js"></script>
<script>
'use strict';
/* =========================================================
   数字星夜 · 一年级数学 20 以内加减法 · Three.js 2D 几何互动游戏
   单文件可运行版：2D 几何夜空世界 + 六场景游戏 + 星级金币
   场景与实物全部用圆形/三角形/矩形/线条等几何图形拼成
   ========================================================= */
try {
/* ---------------- 工具 ---------------- */
const $ = id => document.getElementById(id);
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function rand(a, b){ return a + Math.random() * (b - a); }
function randi(a, b){ return Math.floor(rand(a, b + 1)); }

/* 音效（WebAudio 程序化） */
let AC = null;
function audio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, type, vol, delay){
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(vol || 0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.15));
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + (dur || 0.15) + 0.03);
}
const Sfx = {
  pick:  () => tone(620, .08, 'triangle', .14),
  drop:  () => tone(280, .10, 'sine', .15),
  coin:  () => { tone(880, .10, 'square', .10); tone(1320, .16, 'square', .10, .09); },
  win:   () => [523,659,784,1047].forEach((f,i)=>tone(f, .16, 'triangle', .18, i*.11)),
  fail:  () => [320,240,190].forEach((f,i)=>tone(f, .20, 'sawtooth', .09, i*.14)),
  click: () => tone(650, .05, 'square', .07),
  tick:  () => tone(760, .04, 'square', .06),
  laugh: () => { tone(500,.09,'triangle',.14); tone(680,.11,'triangle',.14,.10); },
  cry:   () => { tone(340,.28,'sine',.12); tone(290,.30,'sine',.12,.24); },
  whoosh:() => tone(220, .30, 'sawtooth', .06),
  meow:  () => { tone(820,.08,'triangle',.12); tone(980,.10,'triangle',.12,.08); },
  boom:  () => { tone(120,.35,'square',.12); tone(80,.4,'sine',.14,.02); },
};

/* 文字贴图 Sprite */
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function textSprite(text, o){
  o = Object.assign({ size: 64, color: '#ffffff', bg: null, border: null, pad: 14, weight: '800', unit: 1.2 }, o || {});
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const font = o.weight + ' ' + (o.size|0) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.font = font;
  const tw = Math.ceil(ctx.measureText(text).width);
  const W = Math.ceil(tw + o.pad*2), H = Math.ceil(o.size*1.5 + o.pad*2);
  c.width = W; c.height = H; ctx.font = font;
  if (o.bg){ ctx.fillStyle = o.bg; roundRectPath(ctx, 1, 1, W-2, H-2, 14); ctx.fill(); }
  if (o.border){ ctx.strokeStyle = o.border; ctx.lineWidth = 3; roundRectPath(ctx, 2, 2, W-4, H-4, 13); ctx.stroke(); }
  ctx.fillStyle = o.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W/2, H/2 + 1);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const u = o.unit; sp.scale.set(W/H*u, u, 1);
  return sp;
}

/* 表情贴图（😊/😢/😴 手绘） */
function faceTex(mood){
  const c = document.createElement('canvas'); c.width = 128; c.height = 112;
  const x = c.getContext('2d');
  x.strokeStyle = '#2b2b3a'; x.fillStyle = '#2b2b3a'; x.lineWidth = 7; x.lineCap = 'round';
  if (mood === 'sleep'){ x.beginPath(); x.arc(42,46,9,0,Math.PI*2); x.fill(); x.beginPath(); x.arc(86,46,9,0,Math.PI*2); x.fill(); }
  else {
    x.beginPath(); x.arc(42,44,11,0,Math.PI*2); x.stroke(); x.beginPath(); x.arc(86,44,11,0,Math.PI*2); x.stroke();
    x.fillStyle = '#2b2b3a';
    x.beginPath(); x.arc(42,44,4,0,Math.PI*2); x.fill(); x.beginPath(); x.arc(86,44,4,0,Math.PI*2); x.fill();
  }
  if (mood === 'happy'){ x.beginPath(); x.arc(64,80,22,0.15*Math.PI,0.85*Math.PI); x.stroke(); }
  else if (mood === 'cry'){ x.beginPath(); x.arc(64,86,20,1.15*Math.PI,1.85*Math.PI); x.stroke();
    x.fillStyle = '#6fb9ff'; x.beginPath(); x.arc(98,62,5,0,Math.PI*2); x.fill(); x.beginPath(); x.arc(101,70,4,0,Math.PI*2); x.fill(); }
  else if (mood === 'sleep'){ x.beginPath(); x.arc(64,84,18,0.1*Math.PI,0.9*Math.PI); x.stroke(); }
  else { x.beginPath(); x.moveTo(50,78); x.lineTo(78,78); x.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  return tex;
}

/* 简单补间动画 */
function tween(obj, props, dur, ease, onDone){
  const from = {}, to = {};
  for (const k in props){ from[k] = obj[k]; to[k] = props[k]; }
  const t0 = performance.now();
  function step(now){
    let t = clamp((now - t0) / (dur * 1000), 0, 1);
    t = ease ? ease(t) : t;
    for (const k in to) obj[k] = from[k] + (to[k] - from[k]) * t;
    if (t < 1) requestAnimationFrame(step); else if (onDone) onDone();
  }
  requestAnimationFrame(step);
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

function minPresses(target, coins){
  if (target <= 0) return 0;
  const d = {0:0}; const q = [0];
  while (q.length){
    const v = q.shift();
    if (v === target) return d[v];
    for (const c of coins){
      const nv = v + c;
      if (nv < 0 || nv > target || d[nv] !== undefined) continue;
      d[nv] = d[v] + 1; q.push(nv);
    }
  }
  return Infinity;
}

/* 存档 */
let SAVE = { coins: 0, stars: 0, best: [[],[],[],[],[],[]] };
try {
  const raw = localStorage.getItem('numstarry_save');
  if (raw) { const p = JSON.parse(raw); if (p && typeof p.coins === 'number') SAVE = p; }
} catch(e){}
function persist(){ try { localStorage.setItem('numstarry_save', JSON.stringify(SAVE)); } catch(e){} }
function refreshHud(){
  $('coinVal').textContent = SAVE.coins;
  $('starVal').textContent = SAVE.stars;
}

/* ---------------- 2D 几何图形工厂 ---------------- */
/* 所有图形都画在 x-y 平面上（z=0），用平涂颜色，正交相机正看 */
function geo(shape, color, opt){
  opt = opt || {};
  return new THREE.Mesh(shape, new THREE.MeshBasicMaterial({
    color: color,
    transparent: !!opt.transparent,
    opacity: (opt.opacity !== undefined ? opt.opacity : 1),
    map: opt.map || null,
    side: opt.side || THREE.FrontSide
  }));
}
function rect(w, h, color, opt){ const m = geo(new THREE.PlaneGeometry(w, h), color, opt); return m; }
function circ(r, color, opt){ const m = geo(new THREE.CircleGeometry(r, 36), color, opt); return m; }
function ring(ir, or, color, opt){ const m = geo(new THREE.RingGeometry(ir, or, 44), color, opt); return m; }
function tri(w, h, color, opt){ // 底 w 高 h 的等腰三角形（尖端朝上，中心在形心附近）
  const s = new THREE.Shape();
  s.moveTo(-w/2, -h/2); s.lineTo(w/2, -h/2); s.lineTo(0, h/2); s.closePath();
  return geo(new THREE.ShapeGeometry(s), color, opt);
}
function lineSeg(x1, y1, x2, y2, color, th){
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(len, .01), th || .06), new THREE.MeshBasicMaterial({ color }));
  m.position.set((x1 + x2)/2, (y1 + y2)/2, 0);
  m.rotation.z = Math.atan2(dy, dx);
  return m;
}
function label(text, x, y, o){
  const sp = textSprite(text, o || {});
  sp.position.set(x, y, 0);
  return sp;
}
/* 2D 火柴人：头(圆)+身体(矩形)+表情，可整体左右翻转 */
function stickMan(color, o){
  o = o || {};
  const g = new THREE.Group();
  const head = circ(.30, o.skin || 0xffe0c0); head.position.y = 1.6; g.add(head);
  const body = rect(.5, 1.0, color); body.position.y = .85; g.add(body);
  if (o.skirt){
    const sk = tri(.9, .55, o.skirt); sk.position.y = .3; g.add(sk);
  }
  const face = new THREE.Sprite(new THREE.SpriteMaterial({ map: o.mood ? faceTex(o.mood) : faceTex('neutral'), transparent: true }));
  face.scale.set(.95, .83, 1); face.position.set(0, 1.62, .1); g.add(face);
  if (o.hat){ // 三角帽/围巾等装饰
    const h = tri(.7, .5, o.hat); h.position.y = 1.95; g.add(h);
  }
  return g;
}


/* ---------------- 渲染引擎（2D 正交） ---------------- */
const wrap = $('sceneWrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1f);

/* 2D 正交相机：竖向固定 ±9，横向按屏幕比例 */
const camera = new THREE.OrthographicCamera(-16, 16, 9, -9, 0.1, 100);
camera.position.set(0, 0, 10); camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  const halfH = 9, halfW = halfH * w / h;
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

/* ---------------- 组管理 ---------------- */
const groups = {};
const groupLights = {};
function makeGroup(name){ const g = new THREE.Group(); scene.add(g); groups[name] = g; groupLights[name] = []; g.visible = false; return g; }
function addLightTo(name, light){ groups[name].add(light); groupLights[name].push(light); }
function showOnly(name){
  for (const k in groups) groups[k].visible = (k === name);
  for (const k in groupLights) for (const l of groupLights[k]) l.visible = (k === name);
}

/* =========================================================
   一、2D 夜空世界：几何小女孩 + 六几何入口
   ========================================================= */
const worldG = makeGroup('world');

/* 夜空渐变背景 + 地面 */
(function(){
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
  const x = cv.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, '#0b1030'); gr.addColorStop(.55, '#121b3d'); gr.addColorStop(1, '#0a0e1f');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
  const bg = geo(new THREE.PlaneGeometry(40, 22), 0xffffff, { map: tex });
  bg.position.z = -5; worldG.add(bg);
  // 地面（夜空下半的深色原野，几何矩形）
  const ground = rect(40, 9.2, 0x141b33); ground.position.set(0, -4.6, -4.5); worldG.add(ground);
  // 两条交汇的道路（灰色几何矩形 + 白色虚线小矩形）
  const road1 = rect(40, 1.7, 0x39415c); road1.position.set(0, -2.6, -4.4); worldG.add(road1);
  const road2 = rect(1.7, 9.2, 0x39415c); road2.position.set(5.5, -4.6, -4.4); worldG.add(road2);
  for (let i = -16; i <= 16; i += 1.1){
    const m = rect(.16, .5, 0xdfe6ff); m.position.set(i, -2.6, -4.3); worldG.add(m);
    const m2 = rect(.5, .16, 0xdfe6ff); m2.position.set(5.5, i - 9, -4.3); worldG.add(m2);
  }
})();

/* 星星（几何圆点阵） */
const starPts = (function(){
  const n = 420, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++){
    pos[i*3]   = rand(-20, 20);
    pos[i*3+1] = rand(.5, 8.6);
    pos[i*3+2] = -4.8;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0xdfe8ff, size: 2.2, transparent: true, opacity: .9, sizeAttenuation: false });
  const p = new THREE.Points(g, m); worldG.add(p); return p;
})();

/* 月亮（黄色大圆 + 光晕 + 睡觉表情） */
(function(){
  const glow = circ(1.9, 0xfff3c9, { transparent: true, opacity: .14 }); glow.position.set(12.6, 6.2, -4.7); worldG.add(glow);
  const moon = circ(1.25, 0xfff3c9); moon.position.set(12.6, 6.2, -4.6); worldG.add(moon);
  const face = new THREE.Sprite(new THREE.SpriteMaterial({ map: faceTex('sleep'), color: 0xfff3c9, transparent: true }));
  face.scale.set(2.1, 1.8, 1); face.position.set(12.6, 6.15, -4.5); worldG.add(face);
})();

/* 云（半透明白色圆组） */
const clouds = [];
(function(){
  for (let i = 0; i < 4; i++){
    const g = new THREE.Group();
    for (let j = 0; j < 3; j++){

/* 世界更新（2D） */
function updateWorld(dt, t){
  const spd = 2.2 * dt;
  if (girlKey.left){ girl.g.position.x -= spd; girl.g.scale.x = -1; girl.dir = -1; }
  else if (girlKey.right){ girl.g.position.x += spd; girl.g.scale.x = 1; girl.dir = 1; }
  else if (girlKey.up){ girl.g.position.y += spd; }
  else if (girlKey.down){ girl.g.position.y -= spd; }
  else {
    const target = Math.sin(t * .22) * 7;
    girl.g.position.x += (target - girl.g.position.x) * Math.min(1, dt * .6);
    girl.g.scale.x = Math.cos(t * .22) >= 0 ? 1 : -1;
  }
  girl.g.position.x = clamp(girl.g.position.x, -14, 14);
  girl.g.position.y = clamp(girl.g.position.y, -7.5, -1.2);
  // 走路起伏 + 火苗闪动
  girl.g.position.y = clamp(girl.g.position.y, -7.5, -1.2) + Math.sin(t * 8) * .05;
  girl.fire.scale.setScalar(1 + Math.sin(t * 13) * .18);
  girl.inner.scale.setScalar(1 + Math.sin(t * 17) * .22);
  // 星星闪烁 + 云漂移
  starPts.material.opacity = .75 + Math.sin(t * 1.7) * .2;
  for (const cl of clouds){ cl.g.position.x += cl.vx * dt; if (cl.g.position.x > 21) cl.g.position.x = -21; }
}

  const r = lower ? 1.95 : 1.75;
  return new THREE.Vector3(-4.2 + Math.cos(a) * r, Math.sin(a) * r * .95, 0);
}

    this.apples.forEach((a, i) => {

      a.visible = true; a.position.copy(a.userData.home);

    });

    this.weightNum.material.needsUpdate = true;
    this.tiltT = clamp((this.X - this.N) * .18, -.4, .4);
    this.bounceT = undefined;
    this.updateStatus();
    this.drag = new THREE.DragControls(this.apples, camera, renderer.domElement);
    const self = this;
    this.drag.addEventListener('dragstart', ev => {
      const a = ev.object;
      if (self.locked) return;
      if (a.parent !== self.appleG){
        const w = a.getWorldPosition(new THREE.Vector3());
        self.appleG.add(a); a.position.copy(w);
      }
      Sfx.pick();
    });
    this.drag.addEventListener('dragend', ev => {
      const a = ev.object;
      if (self.locked) return;
      if (self.onTree.includes(a)){
        const dx = a.position.x - self.panC.x, dy = a.position.y - self.panC.y;
        if (Math.hypot(dx, dy) < 1.5){
          Sfx.drop(); self.addToPan(a);
        } else {
          tween(a.position, a.userData.home, .25, easeOut);
        }
      } else {
        self.panL.add(a);
        a.position.copy(self.panSlotPos(a.userData.slot));
      }
    });
    this.dragEnabled = true;
    this.buildUI();
  },
  panSlotPos(slot){
    const c = slot % 3 - 1, zz = Math.floor(slot / 3);
    return new THREE.Vector3(c * .2, -.05 + zz * .26, 0);
  },
  dropIntoPan(a){
    const slot = this.panSlots.length;
    this.panSlots.push(a); a.userData.slot = slot;
    const tgt = this.panSlotPos(slot);
    const w = a.getWorldPosition(new THREE.Vector3());
    this.panL.add(a);
    a.position.copy(this.panL.worldToLocal(w));
    const self = this;
    tween(a.position, tgt, .24, easeInOut, () => { a.position.copy(tgt); self.updateStatus(); });
  },
  addToPan(a){
    this.onTree = this.onTree.filter(x => x !== a);
    this.dropIntoPan(a);
    this.X++;
    this.updateStatus();
  },
  pickGroup(n){
    if (this.locked) return;
    let taken = 0;
    for (const a of this.onTree.slice()){
      if (taken >= n) break;
      this.addToPan(a);
      taken++;
    }
    if (taken > 0) Sfx.drop();
  },
  updateStatus(){
    const st = $('statusLine');
    const x = this.X, n = this.N;
    this.tiltT = clamp((x - n) * .18, -.4, .4);
    let word, color;
    if (x < n){ word = '苹果轻，再放几个'; color = '#ffd75e'; }
    else if (x > n){ word = '苹果太重了！'; color = '#ff8a7a'; }
    else { word = '平衡啦！'; color = '#8fe8b0'; }
    st.innerHTML = '左边托盘 <b style="color:#fff">' + x + '</b> 个苹果 · 砝码 <b style="color:#ffd75e">' + n + '</b> — <b style="color:' + color + '">' + word + '</b>';
    this.balanceWord.material.map = textSprite(word, { size: 60, color: color, unit: 1.5, bg: 'rgba(10,14,31,.7)', pad: 10 }).material.map;
    this.balanceWord.material.needsUpdate = true;
    if (x === n && !this.won){ this.won = true; setTimeout(() => this.celebrate(), 450); }
    if (x > n && !this.locked){ this.locked = true; this.retries++; Sfx.fail(); toast('太重了！苹果比砝码重，重新开始'); setTimeout(() => this.restartPick(), 1300); }
  },
  restartPick(){
    for (const a of this.apples){
      this.appleG.add(a);
      a.visible = true;
      a.position.copy(a.userData.home);
    }
    this.panSlots = [];
    this.X = 0; this.locked = false; this.won = false;
    this.tiltT = clamp((0 - this.N) * .18, -.4, .4);
    this.updateStatus();
  },
  celebrate(){
    this.locked = true; Sfx.win();
    this.tiltT = 0; this.bounceT = 0;
    toast('平衡啦！' + this.N + ' 个苹果和砝码一样重，全对！');
    setTimeout(() => this.finishWin(), 1600);
  },
  finishWin(){
    this.locked = true;
    const stars = this.retries === 0 ? 3 : (this.retries <= 1 ? 2 : 1);
    const coins = 10 + (stars - 1) * 5;
    SAVE.coins += coins; SAVE.stars += stars;
    if (!SAVE.best[0] || (SAVE.best[0][this.level-1] || 0) < stars){ (SAVE.best[0] = SAVE.best[0] || []); SAVE.best[0][this.level-1] = stars; }
    persist(); refreshHud();
    showRating('摘苹果', stars, coins, this.afterEnd);
  },
  buildUI(){
    clearUI();
    if (this.pickStep > 1){
      for (let i = 1; i <= this.pickStep; i++){
        uiBtn('摘 ' + i + ' 个', () => this.pickGroup(i), 'gold');
      }
      uiMsg('点按钮一次摘几个苹果，放到左边托盘，让天平平衡');
    } else {
      uiMsg('拖动树上的苹果到左边托盘，直到天平平衡（两边一样高）');
    }
  },
  update(dt, t){
    if (!this.fireflies) return;
    const p = this.fireflies.geo.attributes.position.array;
    for (let i = 0; i < this.fireflies.base.length; i += 3){
      p[i]   = this.fireflies.base[i]   + Math.sin(t * .55 + i) * .7;
      p[i+1] = this.fireflies.base[i+1] + Math.sin(t * .85 + i * 1.7) * .4;
    }
    this.fireflies.geo.attributes.position.needsUpdate = true;
    this.fireflies.mat.opacity = .55 + Math.sin(t * 2.2) * .25;
    // 天平：横梁倾斜 + 托盘高低（轻的一头翘起来）
    this.beam.rotation.z += (this.tiltT - this.beam.rotation.z) * Math.min(1, dt * 4.5);
    if (this.bounceT !== undefined){
      this.bounceT += dt;
      if (this.bounceT < 1.5){
        const k = Math.max(0, 1 - this.bounceT / 1.5);
        this.beam.rotation.z += Math.sin(this.bounceT * 11) * .06 * k;
      }
    }
    const th = this.beam.rotation.z, cosT = Math.cos(th), sinT = Math.sin(th);
    const arm = 1.75, px = 0, py = 3.0, panY = 2.05;
    this.panL.position.set(px - arm*cosT, py - arm*sinT, 0);
    this.panR.position.set(px + arm*cosT, py + arm*sinT, 0);
    this.chainL.position.set(px - arm*cosT, (py - arm*sinT) + .95, 0);
    this.chainR.position.set(px + arm*cosT, (py + arm*sinT) + .95, 0);
  },
  end(){ if (this.drag && this.drag.dispose) this.drag.dispose(); clearUI(); $('statusLine').innerHTML = ''; }
};

  start(level, afterEnd){
    this.afterEnd = afterEnd; this.level = level;
    this.errors = 0; this.locked = false; this.nVal = undefined;
    this.phase = 0;
    if (level === 3){
      this.F = randi(1, 3); this.a = randi(5, 9); this.mid = this.F + this.a;
      do { this.b = randi(1, 9); this.T = this.mid - this.b; } while (this.T < 1 || this.T > 9);
      this.phase = 1;
      this.showEq('F + a = ?', '第 1 步：填 a，让男孩从 ' + this.F + ' 层上升');
    } else {
      this.F = randi(1, level === 1 ? 4 : 8);
      if (level === 1){
        this.sign = '+'; this.T = randi(this.F + 1, Math.min(5, this.F + 3));
      } else {
        this.sign = Math.random() < .5 ? '+' : '-';
        if (this.sign === '+'){
          this.T = randi(this.F + 1, Math.min(9, this.F + 9));
        } else if (this.F >= 2){
          this.T = randi(1, this.F - 1);
        } else {
          this.sign = '+'; this.T = randi(this.F + 1, Math.min(9, this.F + 9));
        }
      }
      this.n = this.sign === '+' ? this.T - this.F : this.F - this.T;
      this.showEq('F ○ n = T', '男孩在 ' + this.F + ' 层，要到 ' + this.T + ' 层');
    }
    this.boy.position.set(0, -7.2 + (this.F - 1) * 1.6, -4.2);
    this.setFace('happy');
    this.updateInfo();
    this.buildUI();
  },
  showEq(tpl, hint){
    this.tpl = tpl; this.hintBase = hint;
  },
  updateInfo(){
    const st = $('statusLine');
    const nv = (this.nVal !== undefined && this.nVal !== null) ? this.nVal : '?';
    if (this.phase === 1){
      st.innerHTML = '第 1 步：<b style="color:#fff">' + this.F + ' ＋ <span id="nv">' + nv + '</span> ＝ ' + this.mid + '</b>';
    } else if (this.phase === 2){
      st.innerHTML = '第 2 步：<b style="color:#fff">' + this.mid + ' − <span id="nv">' + nv + '</span> ＝ ' + this.T + '</b>';
    } else {
      const op = this.sign === '+' ? '＋' : '−';
      st.innerHTML = '男孩在 <b style="color:#9ee6ff">' + this.F + '</b> 层 · 要到 <b style="color:#ffd75e">' + this.T + '</b> 层：<b>' + this.F + ' ' + op + ' <span id="nv">' + nv + '</span> ＝ ' + this.T + '</b>';
    }
  },
  setFace(mood){ this.boyFace.material.map = faceTex(mood); this.boyFace.material.needsUpdate = true; },
  setSign(s){ this.sign = s; this.updateInfo(); },
  setN(n){ this.nVal = n; const el = $('nv'); if (el) el.textContent = n; },
  go(){
    const n = this.nVal;
    if (n === undefined || n === null || n === '' ){ toast('请先输入数字'); return; }
    if (this.locked) return;
    if (this.phase === 1){
      if (this.F + n !== this.mid){ this.wrong(); return; }
      this.locked = true; Sfx.whoosh();
      tween(this.boy.position, { y: -7.2 + (this.mid - 1) * 1.6 }, .8, easeInOut, () => {
        this.phase = 2; this.locked = false; this.nVal = undefined;
        this.updateInfo(); this.buildUI();
      });
    } else if (this.phase === 2){
      if (this.mid - n !== this.T){ this.wrong(); return; }
      this.locked = true; Sfx.whoosh();
      tween(this.boy.position, { y: -7.2 + (this.T - 1) * 1.6 }, .8, easeInOut, () => this.win());
    } else {
      const ok = this.sign === '+' ? (this.F + n === this.T) : (this.F - n === this.T);
      if (!ok){ this.wrong(); return; }
      this.locked = true; Sfx.whoosh();
      tween(this.boy.position, { y: -7.2 + (this.T - 1) * 1.6 }, .8, easeInOut, () => this.win());
    }
  },
  wrong(){
    this.errors++; Sfx.cry(); this.setFace('cry');
    tween(this.boy.scale, { x: 1.15, y: .9, z: 1.15 }, .12, null, () => tween(this.boy.scale, { x: 1, y: 1, z: 1 }, .18, easeOut, () => this.setFace('happy')));
    if (this.errors >= 2){
      let hint;
      if (this.phase === 1) hint = '提示：a ＝ ' + (this.mid - this.F);
      else if (this.phase === 2) hint = '提示：b ＝ ' + (this.mid - this.T);
      else hint = this.sign === '+' ? ('提示：n ＝ T − F ＝ ' + (this.T - this.F)) : ('提示：n ＝ F − T ＝ ' + (this.F - this.T));
      toast(hint);
    }
    this.updateInfo();
  },
  win(){
    Sfx.laugh(); this.setFace('happy');
    const stars = this.errors === 0 ? 3 : (this.errors <= 1 ? 2 : 1);
    const coins = 10 + (stars - 1) * 5;
    SAVE.coins += coins; SAVE.stars += stars;
    if ((SAVE.best[2][this.level-1] || 0) < stars) SAVE.best[2][this.level-1] = stars;
    persist(); refreshHud();
    showRating('帮小男孩爬楼梯', stars, coins, this.afterEnd);
  },
  buildUI(){
    clearUI();
    const row = document.createElement('div'); row.style.display = 'contents'; $('gameUI').appendChild(row);
    if (this.phase === 1 || (this.phase === 0 && this.level >= 2)){
      const plus = uiBtn('＋ 加', () => { this.setSign('+'); }, 'green small');
      const minus = uiBtn('− 减', () => { this.setSign('-'); }, 'red small');
    }
    for (let i = 0; i <= 9; i++) uiBtn(String(i), () => this.setN(i), 'tiny');
    uiBtn('清空', () => { this.nVal = undefined; const el = $('nv'); if (el) el.textContent = '?'; }, 'small');
    uiBtn('出发', () => this.go(), 'gold');
  },
  end(){ clearUI(); $('statusLine').innerHTML = ''; }
};

    if (this.locked) return;
    this.locked = true; Sfx.whoosh();
    const E = this.F - this.D - this.A;
    const targetX = 5.5, startX = -4.2;
    let endPos, isHit = false, ring = 0;
    if (this.F < this.D || E < 0){ endPos = { x: (startX + targetX)/2, y: 2.5, z: -4.1 }; isHit = false; }

    const from = { x: this.arrow.position.x, y: this.arrow.position.y, z: this.arrow.position.z };
    const t0 = performance.now(), dur = 900;
    const self = this;
    function step(now){
      let t = clamp((now - t0)/dur, 0, 1);
      const yy = easeOut(t);
      self.arrow.position.set(
        from.x + (endPos.x - from.x) * yy,
        from.y + (endPos.y - from.y) * yy + Math.sin(t*Math.PI) * .35,
        from.z + (endPos.z - from.z) * yy
      );
      self.arrow.rotation.z = Math.atan2(endPos.y - from.y, endPos.x - from.x) * Math.min(1, t * 3);
      if (t < 1) requestAnimationFrame(step);
      else {
        self.arrow.visible = isHit || E <= 9;
        self.resolve(isHit, ring, E);
      }
    }
    requestAnimationFrame(step);
  },
  resolve(isHit, ring, E){
    const st = $('statusLine');
    if (!isHit){
      st.innerHTML = '脱靶！0 分（力度 ' + this.F + '，有效值 ' + E + '）';
      Sfx.fail();
    } else {
      const score = 10 - ring;
      this.total += score;
      Sfx.coin();
      st.innerHTML = '命中 <b style="color:#ffd75e">' + ring + ' 环</b> ＋' + score + ' 分 · 本轮累计 <b>' + this.total + '</b>';
    }
    $('formula').textContent = '有效值 ＝ 力度 − 距离 − 角度 ＝ ' + this.F + ' − ' + this.D + ' − ' + this.A + ' ＝ ' + E;
    setTimeout(() => {
      if (this.round >= 3) this.finish();
      else { this.round++; this.newRound([3,5,8][this.level-1], [2,5,5][this.level-1]); this.locked = false; }
    }, 1600);
  },
  finish(){
    const stars = this.total >= 25 ? 3 : (this.total >= 18 ? 2 : 1);
    const coins = 10 + (stars - 1) * 5;
    SAVE.coins += coins; SAVE.stars += stars;
    if ((SAVE.best[3][this.level-1] || 0) < stars) SAVE.best[3][this.level-1] = stars;
    persist(); refreshHud();
    showRating('打靶', stars, coins, this.afterEnd, '总积分 ' + this.total + ' / 30');
  },
  buildUI(){
    clearUI();
    const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;align-items:center;gap:8px;background:rgba(10,14,31,.78);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 14px';
    const lab = document.createElement('span'); lab.style.cssText = 'font-size:16px;color:#fff;font-weight:700'; lab.textContent = '力度';
    const slider = document.createElement('input'); slider.type = 'range'; slider.min = 0; slider.max = 20; slider.value = 0; slider.id = 'forceSlider';
    slider.style.width = '200px';
    slider.addEventListener('input', () => {
      this.F = parseInt(slider.value, 10);
      const el = $('fv'); if (el) el.textContent = this.F;
    });
    wrap.appendChild(lab); wrap.appendChild(slider);
    $('gameUI').appendChild(wrap);
    uiBtn('射箭', () => this.shoot(), 'gold');
    uiMsg('调整力度后射箭，共 3 次机会');
  },
  end(){ clearUI(); $('statusLine').innerHTML = ''; $('formula').textContent = ''; }
};

/* ---------------- 游戏 5：时钟救援（2D 几何） ---------------- */
const clockG = makeGroup('clock');
const clockGame = {
  init(){ const g = clockG;
    // 夜景背景
    const skyC = document.createElement('canvas'); skyC.width = 64; skyC.height = 256;
    const sk = skyC.getContext('2d');
    const grad = sk.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#0d1228'); grad.addColorStop(1, '#1a2238');
    sk.fillStyle = grad; sk.fillRect(0, 0, 64, 256);
    const skyTex = new THREE.CanvasTexture(skyC); skyTex.encoding = THREE.sRGBEncoding;
    const sky = geo(new THREE.PlaneGeometry(40, 22), 0xffffff, { map: skyTex });
    sky.position.z = -5; g.add(sky);
    const ground = rect(40, 3.2, 0x141b33); ground.position.set(0, -7.4, -4.5); g.add(ground);
    // 纸箱（棕色矩形）+ 小猫（几何猫：圆头 + 矩形身 + 三角耳 + 圆眼）
    const box = rect(2.1, 1.3, 0xc98a3e); box.position.set(-4.2, -4.3, -4.3); g.add(box);
    this.kitten = new THREE.Group();
    const body = rect(.62, .7, 0xffb366); body.position.y = -.25; this.kitten.add(body);
    const head = circ(.34, 0xffb366); head.position.y = .42; this.kitten.add(head);
    for (const sx of [-.2, .2]){
      const ear = tri(.22, .26, 0xffb366); ear.position.set(sx, .82, .05); this.kitten.add(ear);
    }
    for (const sx of [-.12, .12]){
      const eye = circ(.05, 0x2b2b3a); eye.position.set(sx, .48, .08); this.kitten.add(eye);
    }
    const nose = tri(.1, .08, 0xd94a4a); nose.position.set(0, .36, .08); this.kitten.add(nose);
    this.kitten.position.set(-4.2, -3.6, -4.2); g.add(this.kitten);
    // 圆形时钟（几何圆环 + 刻度线 + 数字 + 指针矩形）
    this.clockRing = ring(1.9, 2.08, 0x5b6fc0);
    this.clockRing.position.set(3.4, 2.6, -4.3); g.add(this.clockRing);
    const cx = 3.4, cy = 2.6;
    for (let i = 0; i < 10; i++){
      const a = i * Math.PI*2/10;
      const tick = lineSeg(cx + Math.cos(a)*1.85, cy + Math.sin(a)*1.85, cx + Math.cos(a)*2.0, cy + Math.sin(a)*2.0, 0xffffff, .06);
      tick.position.z = -4.2; g.add(tick);
      const num = textSprite(String(i), { size: 44, color: '#9ee6ff', unit: .5, pad: 0 });
      num.position.set(cx + Math.cos(a)*1.45, cy + Math.sin(a)*1.45, -4.2); g.add(num);
    }
    this.hand = rect(.12, 1.55, 0xff5a4d);
    this.hand.position.set(cx, cy + .78, -4.2); g.add(this.hand);
    this.clockBase = new THREE.Vector3(cx, cy, -4.2);
    this.clockG = g;
  },
  start(level, afterEnd){
    this.afterEnd = afterEnd; this.level = level;
    const cfg = [[7,5,[1,2]],[12,7,[1,2,5,-1,-2]],[18,9,[1,2,5,-1,-2,-3]]][level-1];
    this.V = randi(level === 1 ? 5 : (level === 2 ? 8 : 10), cfg[0]);
    this.airMax = cfg[1]; this.buttons = cfg[2];
    this.value = 0; this.air = this.airMax; this.presses = 0; this.locked = false; this.won = false;
    this.hand.position.set(this.clockBase.x, this.clockBase.y + .78, this.clockBase.z);
    this.kitten.scale.set(1,1,1);
    this.updateUI();
    this.buildUI();
  },
  updateUI(){
    const ones = this.value % 10, tens = Math.floor(this.value / 10);
    $('statusLine').innerHTML =
      '目标 <b style="color:#ffd75e">' + this.V + ' 秒</b> · 时钟 <b style="color:#9ee6ff">' + tens + ' ' + ones + '</b> · 空气 <b style="color:#8fe8b0">' + this.air + '/' + this.airMax + '</b> · 按键 ' + this.presses + ' 次';
    const a = this.value / 10 * Math.PI * 2;
    this.hand.position.set(this.clockBase.x + Math.sin(a) * .78, this.clockBase.y + Math.cos(a) * .78, this.clockBase.z);
    this.kitten.scale.setScalar(1 + Math.sin(performance.now()/400) * .03);
  },
  press(v){
    if (this.locked) return;
    const prev = this.value;
    this.value += v;
    if (this.value < 0) this.value = 0;
    this.presses++; this.air--;
    Sfx.tick();
    const carry = (this.value % 10) < (prev % 10) && this.value > prev;
    const borrow = (this.value % 10) > (prev % 10) && this.value < prev;
    $('formula').textContent = (v > 0 ? '+' : '') + v + ' → ' + prev + ' ' + (v >= 0 ? '＋' : '−') + Math.abs(v) + ' ＝ ' + this.value + (carry ? '（十位进 1）' : (borrow ? '（十位退 1）' : ''));
    if (carry){ Sfx.coin(); toast('进 1！'); }
    if (borrow){ Sfx.tick(); toast('退 1！'); }
    if (this.value === this.V){ this.locked = true; setTimeout(() => this.win(), 350); }
    else if (this.air <= 0){ this.locked = true; setTimeout(() => this.fail(), 350); }
    this.updateUI();
  },
  win(){
    Sfx.meow(); Sfx.win();
    tween(this.kitten.scale, { x: 1.4, y: 1.4, z: 1.4 }, .4, easeOut);
    const minAll = minPresses(this.V, this.buttons);
    const stars = this.presses <= minAll + 1 ? 3 : (this.presses <= this.airMax - 1 ? 2 : 1);
    const coins = 10 + (stars - 1) * 5;
    SAVE.coins += coins; SAVE.stars += stars;
    if ((SAVE.best[4][this.level-1] || 0) < stars) SAVE.best[4][this.level-1] = stars;
    persist(); refreshHud();
    showRating('时钟救援', stars, coins, this.afterEnd, '用了 ' + this.presses + ' 次按键');
  },
  fail(){
    Sfx.fail(); toast('空气用完了…再试一次！');
    setTimeout(() => {
      this.value = 0; this.air = this.airMax; this.presses = 0; this.locked = false;
      this.updateUI();
    }, 1200);
  },
  buildUI(){
    clearUI();
    for (const v of this.buttons){
      const cls = v > 0 ? 'green' : 'red';
      uiBtn((v > 0 ? '+' : '') + v, () => this.press(v), cls + ' small');
    }
    uiMsg('把时钟凑到目标秒数，按键越少越好');
  },
  end(){ clearUI(); $('statusLine').innerHTML = ''; $('formula').textContent = ''; }
};


/* ---------------- 游戏 6：方阵寻宝（2D 几何） ---------------- */
const matrixG = makeGroup('matrix');
const matrixGame = {
  init(){ const g = matrixG;
    // 夜空背景 + 网格区
    const skyC = document.createElement('canvas'); skyC.width = 64; skyC.height = 256;
    const sk = skyC.getContext('2d');
    const grad = sk.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#0b0f26'); grad.addColorStop(1, '#101830');
    sk.fillStyle = grad; sk.fillRect(0, 0, 64, 256);
    const skyTex = new THREE.CanvasTexture(skyC); skyTex.encoding = THREE.sRGBEncoding;
    const sky = geo(new THREE.PlaneGeometry(40, 22), 0xffffff, { map: skyTex });
    sky.position.z = -5; g.add(sky);
    const board = rect(10.2, 10.2, 0x1c2547); board.position.set(0, 0, -4.4); g.add(board);
    this.tiles = [];
    for (let r = 0; r < 10; r++){
      for (let c = 0; c < 10; c++){
        const tile = rect(.84, .84, 0x27335c);
        tile.position.set(c - 4.5, r - 4.5, -4.3);
        tile.userData.baseColor = 0x27335c;
        g.add(tile); this.tiles.push(tile);
        const num = textSprite(String(r*10 + c), { size: 28, color: '#8fa2e8', unit: .42, pad: 0 });
        num.position.set(c - 4.5, r - 4.5, -4.2); g.add(num);
      }
    }
    // 玩家（金色几何圆）
    this.player = circ(.36, 0xffd75e);
    this.player.position.set(-4.5, -4.5, -4.1);
    g.add(this.player);
    // 目标格（红色矩形边框）
    this.targetTile = rect(.9, .9, 0xff5a4d, { transparent: true, opacity: .55 });
    this.targetTile.visible = false;
    g.add(this.targetTile);
    this.matrixG = g;
  },
  start(level, afterEnd){
    this.afterEnd = afterEnd; this.level = level;
    this.Smax = level === 1 ? 1 : (level === 2 ? 3 : 5);
    this.S = 1;
    this.score = 100; this.steps = 0; this.locked = false; this.won = false;
    do {
      this.P = randi(0, 99);
      if (level === 1){
        const dir = Math.random() < .5;
        const step = randi(1, 9);
        this.T = dir ? Math.min(99, this.P + step) : Math.max(0, this.P - step);
        if (dir) this.T = this.P + Math.min(step, 9 - this.P % 10);
        else this.T = this.P - Math.min(step, this.P % 10);
      } else {
        this.T = randi(0, 99);
      }
    } while (this.T === this.P);
    this.updateGrid();
    this.updateInfo();
    this.buildUI();
  },
  updateGrid(){
    const r = Math.floor(this.P / 10), c = this.P % 10;
    this.player.position.set(c - 4.5, r - 4.5, -4.1);
    const tr = Math.floor(this.T / 10), tc = this.T % 10;
    this.targetTile.position.set(tc - 4.5, tr - 4.5, -4.2);
    this.targetTile.visible = true;
  },
  updateInfo(){
    $('statusLine').innerHTML =
      '你在 <b style="color:#9ee6ff">' + this.P + '</b> · 目标 <b style="color:#ffd75e">' + this.T + '</b> · 步数 ' + this.steps + ' · 分数 <b style="color:#8fe8b0">' + this.score + '</b> · 步长 ' + this.S;
  },
  move(dir){
    if (this.locked || this.won) return;
    const r = Math.floor(this.P / 10), c = this.P % 10;
    let np = this.P, label = '';
    if (dir === 'left'){ if (c - this.S < 0){ this.oob(); return; } np = this.P - this.S; label = this.P + ' − ' + this.S + ' ＝ ' + np; }
    else if (dir === 'right'){ if (c + this.S > 9){ this.oob(); return; } np = this.P + this.S; label = this.P + ' ＋ ' + this.S + ' ＝ ' + np; }
    else if (dir === 'up'){ if (r - this.S < 0){ this.oob(); return; } np = this.P - 10 * this.S; label = this.P + ' − ' + (10*this.S) + ' ＝ ' + np; }
    else if (dir === 'down'){ if (r + this.S > 9){ this.oob(); return; } np = this.P + 10 * this.S; label = this.P + ' ＋ ' + (10*this.S) + ' ＝ ' + np; }
    this.P = np; this.steps++;
    this.score -= Math.max(1, 5 - this.S);
    Sfx.tick();
    this.updateGrid();
    $('formula').textContent = label;
    this.updateInfo();
    if (this.P === this.T){ this.won = true; this.locked = true; setTimeout(() => this.win(), 400); }
  },
  oob(){
    this.score = Math.max(0, this.score - 1);
    toast('出界！扣 1 分');
    this.updateInfo();
  },
  hint(){
    if (this.locked || this.won) return;
    this.score = Math.max(0, this.score - 1);
    Sfx.click();
    const tr = Math.floor(this.T / 10), tc = this.T % 10;
    for (const t of this.tiles){
      if (Math.round(t.position.x + 4.5) === tc || Math.round(t.position.y + 4.5) === tr){
        t.material = new THREE.MeshBasicMaterial({ color: 0x8fe8ff });
      }
    }
    toast('高亮了目标的行与列（−1 分）');
    setTimeout(() => {
      for (const t of this.tiles) t.material = new THREE.MeshBasicMaterial({ color: 0x27335c });
    }, 1600);
    this.updateInfo();
  },
  win(){
    Sfx.win();
    const stars = this.score >= 90 ? 3 : (this.score >= 80 ? 2 : 1);
    const coins = 10 + (stars - 1) * 5;
    SAVE.coins += coins; SAVE.stars += stars;
    if ((SAVE.best[5][this.level-1] || 0) < stars) SAVE.best[5][this.level-1] = stars;
    persist(); refreshHud();
    showRating('方阵寻宝', stars, coins, this.afterEnd, '剩余 ' + this.score + ' 分');
  },
  buildUI(){
    clearUI();
    uiBtn('← 左', () => this.move('left'), 'small');
    uiBtn('→ 右', () => this.move('right'), 'small');
    uiBtn('↑ 上', () => this.move('up'), 'small');
    uiBtn('↓ 下', () => this.move('down'), 'small');
    const row = document.createElement('div'); row.className = 'grow'; $('gameUI').appendChild(row);
    for (let s = 1; s <= this.Smax; s++) uiBtn('步长 ' + s, () => { this.S = s; this.updateInfo(); }, 'tiny');
    uiBtn('提示(−1分)', () => this.hint(), 'gold tiny');
  },
  end(){ clearUI(); $('statusLine').innerHTML = ''; $('formula').textContent = ''; this.targetTile.visible = false; }
};

/* ---------------- 场景切换与流程 ---------------- */
const gameInstances = [appleGame, crossGame, stairGame, shootGame, clockGame, matrixGame];
const gameNames = ['摘苹果', '扶老奶奶过马路', '帮小男孩爬楼梯', '打靶', '时钟救援', '方阵寻宝'];
const gameDescs = [
  '把树上的苹果摘到左边托盘，让天平平衡：右边砝码是多少，就摘多少个苹果。数字就是苹果的个数。',
  '按 ＋1/＋2/＋5 让老奶奶走过数轴，绿灯用光前到达终点。步数越少分越高。',
  '男孩在 F 层，要到 T 层。填上 ＋/− 和数字，让他到达目标楼层。',
  '距离 ＋ 角度 ＝ 力度才能中 0 环（靶心最高分）。三次机会累计积分。',
  '用 ＋/− 按钮把时钟凑到目标秒数。个位逢九进一、逢零退一。按键越少越好。',
  '在 0–99 方阵里走到目标格。左减 S、右加 S、上减 10S、下加 10S。'
];

let activeName = 'world';
let currentGame = -1, currentLevel = 1, pendingAfterEnd = null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000);
}

/* UI 工具 */
function clearUI(){ $('gameUI').innerHTML = ''; }
function uiBtn(label, fn, cls){
  const b = document.createElement('button');
  b.className = 'gbtn ' + (cls || '');
  b.textContent = label;
  b.addEventListener('click', () => { audio(); Sfx.click(); fn(); });
  $('gameUI').appendChild(b);
  return b;
}
function uiMsg(html){
  const d = document.createElement('div');
  d.className = 'gmsg'; d.innerHTML = html;
  $('gameUI').appendChild(d);
  return d;
}

/* 难度选择 + 开始 */
function showIntro(gameIdx, defLevel){
  currentGame = gameIdx - 1;
  $('introTitle').textContent = gameNames[currentGame];
  $('introDesc').innerHTML = gameDescs[currentGame] + '<br><span style="color:#ffd75e">最高记录：' + (maxBest(currentGame) || 0) + ' 星</span>';
  const row = $('lvlRow'); row.innerHTML = '';
  currentLevel = clamp(defLevel || 1, 1, 3);
  const btns = [];
  for (let l = 1; l <= 3; l++){
    const b = document.createElement('button');
    b.className = 'lvlBtn' + (l === currentLevel ? ' on' : '');
    b.textContent = '★'.repeat(l);
    b.addEventListener('click', () => {
      currentLevel = l;
      btns.forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      Sfx.click();
    });
    row.appendChild(b); btns.push(b);
  }
  $('introScreen').classList.remove('hidden');
}
$('introGo').addEventListener('click', () => {
  $('introScreen').classList.add('hidden');
  enterGame(currentGame, currentLevel);
});

function enterGame(idx, level){
  audio();
  fadeIn(() => {
    showOnly('world');
    groups['world'].visible = false;
    const keys = ['apple','cross','stair','shoot','clock','matrix'];
    groups[keys[idx]].visible = true;
    for (const k in groupLights) for (const l of groupLights[k]) l.visible = (k === keys[idx]);
    activeName = keys[idx];
    $('backBtn').style.display = 'inline-block';
    pendingAfterEnd = () => backToWorld();
    gameInstances[idx].start(level, pendingAfterEnd);
    fadeOut();
  });
}

function backToWorld(){
  if (currentGame >= 0 && gameInstances[currentGame].end) gameInstances[currentGame].end();
  currentGame = -1;
  fadeIn(() => {
    showOnly('world');
    activeName = 'world';
    $('backBtn').style.display = 'none';
    fadeOut();
  });
}

/* 结算 */
function showRating(name, stars, coins, afterEnd, extra){
  $('ratingTitle').textContent = name + ' · 完成！';
  const st = $('ratingStars');
  st.innerHTML = '';
  for (let i = 0; i < 3; i++){
    const s = document.createElement('span');
    s.textContent = '★';
    s.className = i < stars ? '' : 'off';
    st.appendChild(s);
  }
  $('ratingGot').textContent = (extra ? extra + ' · ' : '') + '金币 +' + coins;
  $('ratingScreen').classList.remove('hidden');
  $('againBtn').onclick = () => {
    $('ratingScreen').classList.add('hidden');
    enterGame(currentGame >= 0 ? currentGame : 0, currentLevel);
  };
  $('backWorldBtn').onclick = () => {
    $('ratingScreen').classList.add('hidden');
    afterEnd && afterEnd();
  };
  audio(); Sfx.win();
}

/* 淡入淡出 */
function fadeIn(fn){ const f = $('fade'); f.classList.add('on'); setTimeout(() => { fn(); }, 260); }
function fadeOut(){ const f = $('fade'); f.classList.remove('on'); }

/* ---------------- 主循环 ---------------- */
$('startBtn').addEventListener('click', () => {
  audio(); Sfx.win();
  $('startScreen').classList.add('hidden');
  refreshHud();
  toast('走向发光的几何入口，点击进入游戏');
});
$('backBtn').addEventListener('click', backToWorld);

/* 调试/测试句柄（对玩法无影响） */
window.__game = { groups, worldG, girl, camera, renderer, appleGame, crossGame, stairGame, shootGame, clockGame, matrixGame, showIntro, enterGame, backToWorld, maxBest };
window.__state = { get active(){ return activeName; }, get currentGame(){ return currentGame; }, get level(){ return currentLevel; } };

const clock = new THREE.Clock();
let lastT = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, .05); lastT = now;
  const t = now / 1000;
  if (activeName === 'world') updateWorld(dt, t);
  else if (activeName === 'apple' && appleGame.update) appleGame.update(dt, t);
  renderer.render(scene, camera);
}

/* 初始化 */
(function boot(){
  appleGame.init(); crossGame.init(); stairGame.init(); shootGame.init(); clockGame.init(); matrixGame.init();
  groups['world'].visible = true;
  showOnly('world');
  refreshHud();
  animate();
})();
} catch(e){
  console.error(e);
  const s = document.getElementById('startScreen');
  if (s) s.innerHTML = '<div class="card"><h1>数字星夜加载失败了</h1><p>可能是网络问题导致 three.js 加载失败，请检查网络后刷新页面重试。</p></div>';
}
